<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RentCar</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="login-body">

    <div class="login-box">
        <h1>RentCarSA</h1>
        <p>Gestor de alquileres</p>

        <div class="login-form">
            <label>Usuario</label>
            <input type="text" id="txtUsuario" placeholder="Ingrese usuario">

            <label>Contraseña</label>
            <input type="password" id="txtPassword" placeholder="Ingrese contraseña">

            <button class="btn-principal btn-login" onclick="iniciarSesion()">
                Ingresar
            </button>

            <button class="btn-secundario btn-login" onclick="mostrarRegistroCliente()">
                Crear cuenta de cliente
            </button>
            <h1>Cuenta admin</h1>
            <p>Nombre=admin</p>
            <p>Contraseña=1234</p>

            <p id="mensajeLogin" class="mensaje-login"></p>
        </div>

        <div id="registroCliente" class="registro-cliente" style="display:none;">
            <h3>Crear cuenta de cliente</h3>

            <label>Nombre</label>
            <input type="text" id="regNombre" placeholder="Nombre completo">

            <label>Cédula</label>
            <input type="text" id="regCedula" placeholder="Cédula">

            <label>Teléfono</label>
            <input type="text" id="regTelefono" placeholder="Teléfono">

            <label>Email</label>
            <input type="email" id="regEmail" placeholder="Email">

            <label>Usuario</label>
            <input type="text" id="regUsuario" placeholder="Usuario para ingresar">

            <label>Contraseña</label>
            <input type="password" id="regPassword" placeholder="Contraseña">

            <button class="btn-principal btn-login" onclick="registrarCuentaCliente()">
                Crear cuenta
            </button>

            <button class="btn-secundario btn-login" onclick="ocultarRegistroCliente()">
                Cancelar
            </button>

            <p id="mensajeRegistro" class="mensaje-login"></p>
        </div>
    </div>

    <script src="js/modelos/Usuario.js"></script>
    <script src="js/modelos/Cliente.js"></script>
    <script src="js/modelos/Vehiculo.js"></script>
    <script src="js/modelos/Alquiler.js"></script>
    <script src="js/repositorios/UsuarioRepository.js"></script>
    <script src="js/repositorios/ClienteRepository.js"></script>
    <script src="js/repositorios/VehiculoRepository.js"></script>
    <script src="js/repositorios/AlquilerRepository.js"></script>
    <script src="js/controladores/SistemaController.js"></script>
    <script src="js/controladores/UsuarioController.js"></script>
    <script src="js/controladores/ClienteController.js"></script>

    <script>
        function prepararDatosIniciales() {
            let datosUsuarios = localStorage.getItem("usuarios");
            let datosClientes = localStorage.getItem("clientes");

            let listaUsuarios = datosUsuarios ? JSON.parse(datosUsuarios) : [];
            let listaClientes = datosClientes ? JSON.parse(datosClientes) : [];


            let clientesMigrados = listaUsuarios.filter(function(u) {
                return u.rol === "Cliente";
            });

            clientesMigrados.forEach(function(u) {
                let cliente = listaClientes.find(function(c) {
                    return c.id === u.clienteId;
                });

                if (!cliente) {
                    let mayor = 0;
                    listaClientes.forEach(function(c) {
                        if (c.id > mayor) mayor = c.id;
                    });

                    cliente = {
                        id: mayor + 1,
                        nombre: u.nombre,
                        cedula: "",
                        telefono: "",
                        email: "",
                        usuario: u.usuario,
                        password: u.password
                    };
                    listaClientes.push(cliente);
                } else {
                    cliente.usuario = cliente.usuario || u.usuario;
                    cliente.password = cliente.password || u.password;
                }
            });

            listaUsuarios = listaUsuarios.filter(function(u) {
                return u.rol !== "Cliente";
            });

            let admin = listaUsuarios.find(function(u) {
                return u.usuario.toLowerCase() === "admin";
            });

            if (!admin) {
                let mayorUsuario = 0;
                listaUsuarios.forEach(function(u) {
                    if (u.id > mayorUsuario) mayorUsuario = u.id;
                });

                listaUsuarios.push({
                    id: mayorUsuario + 1,
                    nombre: "Administrador",
                    usuario: "admin",
                    password: "1234"
                });
            }

            localStorage.setItem("usuarios", JSON.stringify(listaUsuarios));
            localStorage.setItem("clientes", JSON.stringify(listaClientes));
        }

        function iniciarSesion() {
            let usuarioIngresado = document.getElementById("txtUsuario").value.trim();
            let passwordIngresada = document.getElementById("txtPassword").value;
            let mensaje = document.getElementById("mensajeLogin");

            mensaje.textContent = "";
            prepararDatosIniciales();

            let datosUsuarios = JSON.parse(localStorage.getItem("usuarios") || "[]");
            let administrador = datosUsuarios.find(function(usuario) {
                return usuario.usuario.toLowerCase() === usuarioIngresado.toLowerCase() &&
                       usuario.password === passwordIngresada;
            });

            if (administrador) {
                localStorage.setItem("usuarioSesion", JSON.stringify({
                    tipo: "Administrador",
                    id: administrador.id,
                    nombre: administrador.nombre,
                    usuario: administrador.usuario
                }));
                window.location.href = "index.html";
                return;
            }

            let datosClientes = JSON.parse(localStorage.getItem("clientes") || "[]");
            let cliente = datosClientes.find(function(c) {
                return c.usuario &&
                       c.usuario.toLowerCase() === usuarioIngresado.toLowerCase() &&
                       c.password === passwordIngresada;
            });

            if (cliente) {
                localStorage.setItem("usuarioSesion", JSON.stringify({
                    tipo: "Cliente",
                    id: cliente.id,
                    clienteId: cliente.id,
                    nombre: cliente.nombre,
                    usuario: cliente.usuario
                }));
                window.location.href = "index.html";
                return;
            }

            mensaje.textContent = "Usuario o contraseña incorrectos.";
        }

        function mostrarRegistroCliente() {
            document.getElementById("registroCliente").style.display = "block";
            document.querySelector(".login-form").style.display = "none";
        }

        function ocultarRegistroCliente() {
            document.getElementById("registroCliente").style.display = "none";
            document.querySelector(".login-form").style.display = "flex";
        }

        function registrarCuentaCliente() {
            let mensaje = document.getElementById("mensajeRegistro");

            let datos = {
                nombre: document.getElementById("regNombre").value.trim(),
                cedula: document.getElementById("regCedula").value.trim(),
                telefono: document.getElementById("regTelefono").value.trim(),
                email: document.getElementById("regEmail").value.trim(),
                usuario: document.getElementById("regUsuario").value.trim(),
                password: document.getElementById("regPassword").value
            };

            if (!datos.nombre || !datos.cedula || !datos.telefono ||
                !datos.email || !datos.usuario || !datos.password) {
                mensaje.textContent = "Debe completar todos los campos.";
                return;
            }

            prepararDatosIniciales();

            let resultado = registrarClienteDesdeLogin(datos);

            if (!resultado.exito) {
                mensaje.textContent = resultado.mensaje;
                return;
            }

            alert("Cuenta de cliente creada correctamente. Ahora puede iniciar sesión.");
            document.getElementById("txtUsuario").value = datos.usuario;
            document.getElementById("txtPassword").value = datos.password;

            document.getElementById("regNombre").value = "";
            document.getElementById("regCedula").value = "";
            document.getElementById("regTelefono").value = "";
            document.getElementById("regEmail").value = "";
            document.getElementById("regUsuario").value = "";
            document.getElementById("regPassword").value = "";
            mensaje.textContent = "";

            ocultarRegistroCliente();
        }

        prepararDatosIniciales();
    </script>
</body>
</html>
